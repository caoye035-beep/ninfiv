<style>
  /* --- 纯样式修复：强制间距、强制16px、强制头像 --- */
#chat .msg {
    margin: 24px 0 !important; /* 消息之间的上下大间距 */
    display: flex !important;
    flex-direction: column !important;
}
#chat .msg .bd {
    font-size: 16px !important; /* 强制统一字体大小为 16px */
    line-height: 1.6 !important;
    letter-spacing: 0.5px !important;
    padding: 12px 16px !important; /* 强行增加文字到边缘的内边距 */
    border-radius: 16px !important;
}
#chat .msg.user .bd {
    background: var(--user-msg) !important;
    border-bottom-right-radius: 4px !important;
}
#chat .msg.ai .bd {
    background: var(--ai-msg) !important;
    border-bottom-left-radius: 4px !important;
}
/* 强制修复时间、按钮与消息的间距 */
#chat .meta {
    margin-top: 10px !important;
    gap: 16px !important; /* 按钮之间拉开距离 */
}
/* 如果原本没有头像，强制把头部撑开 */
.ai-head { 
    display: flex !important; 
    margin-bottom: 10px !important; 
}
:root{
--bg:#f7f7f6;--panel:#ffffff;--text:#222222;
--sub:#80807e;--line:#e5e5e3;--bubble:#ededeb;
--accent:#5f6368;--accent-t:#ffffff;--danger:#b3473f;
--user-msg:#ededeb;--user-msg-text:#222222;--ai-msg:transparent;--ai-msg-text:inherit;--bubble-radius:16px;--glass-alpha:1;--glass-blur:0px;--fs:15px;--chat-fs:15px;--font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--r:12px;
}
:root[data-mode="dark"]{
--bg:#171717;--panel:#212121;--text:#e8e8e6;
--sub:#9a9a98;--line:#333333;--bubble:#2c2c2c;
--accent:#b8bbbe;--accent-t:#171717;--danger:#d9786f;
}
@media(prefers-color-scheme:dark){
:root[data-mode="auto"]{
--bg:#171717;--panel:#212121;--text:#e8e8e6;
--sub:#9a9a98;--line:#333333;--bubble:#2c2c2c;
--accent:#b8bbbe;--accent-t:#171717;--danger:#d9786f;
}
}
:root[data-theme="green"]{--accent:#5b7a68}
:root[data-theme="blue"]{--accent:#5d7390}
:root[data-theme="purple"]{--accent:#76688f}
:root[data-theme="sand"]{--accent:#8a7d68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font:var(--fs)/1.6 var(--font-family)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel);
border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%}
textarea{resize:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top{height:52px;padding:0 6px;display:flex;align-items:center;
justify-content:space-between;padding-top:env(safe-area-inset-top)}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib:active{background:var(--bubble)}
</style>
<style>
  .logo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
width:84px;height:84px;color:var(--text);opacity:.9;pointer-events:none}
.logo svg{width:100%;height:100%;fill:currentColor}
#chat{flex:1;overflow-y:auto;padding:8px 14px 16px;position:relative}
.msg{margin:12px 0;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.user .bd{background:var(--user-msg);color:var(--user-msg-text);border-radius:var(--bubble-radius) var(--bubble-radius) 4px var(--bubble-radius);
padding:9px 13px;max-width:86%;white-space:pre-wrap;word-break:break-word}
.msg.ai .bd{background:var(--ai-msg);color:var(--ai-msg-text);border-radius:var(--bubble-radius);padding:2px 0;white-space:pre-wrap;word-break:break-word}
.msg.ai .bd{max-width:100%;white-space:pre-wrap;word-break:break-word}
#chat .msg .bd{font-size:var(--chat-fs)}
.msg .meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msg img.att{max-width:180px;border-radius:10px;margin-bottom:6px}
.bar{padding:6px 12px calc(10px + env(safe-area-inset-bottom));
background:var(--bg)}
.box{background:color-mix(in srgb,var(--panel) calc(var(--glass-alpha)*100%),transparent);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--line);
border-radius:20px;padding:8px 10px}
.box textarea{border:0;background:none;padding:4px 4px;
max-height:140px;min-height:36px}
.row{display:flex;align-items:center;gap:2px;margin-top:2px}
.row .grow{flex:1}
.pill{display:flex;align-items:center;gap:4px;padding:6px 10px;
border-radius:16px;font-size:13px;color:var(--sub);max-width:46vw}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill:active{background:var(--bubble)}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);
color:var(--accent-t);display:flex;align-items:center;justify-content:center}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
#side{position:fixed;left:0;top:0;bottom:0;width:78%;max-width:320px;
background:var(--panel);z-index:21;transform:translateX(-100%);
transition:transform .22s;display:flex;flex-direction:column;
padding-top:env(safe-area-inset-top)}
#side.open{transform:none}
.side-h{padding:14px 16px;font-weight:600}
.profile{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.profile img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bubble)}
.profile .grow{min-width:0}
.profile .sub{font-size:12px;color:var(--sub)}
.conv .pin{font-size:12px;color:var(--sub);margin-right:5px}
.color-line{display:flex;gap:8px;align-items:center}
.color-line input[type=color]{width:44px;height:40px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.color-line input[type=text]{flex:1;min-width:0}
  .side-list{flex:1;overflow-y:auto;padding:0 8px}
.conv{padding:10px 12px;border-radius:10px;display:flex;

.conv.on,.conv:active{background:var(--bubble)}
.conv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-f{display:flex;justify-content:flex-end;

.menu{position:fixed;background:var(--panel);border:1px solid var(--line);

.menu button{display:flex;align-items:center;gap:10px;width:100%;
padding:10px 12px;border-radius:9px;text-align:left}
.menu button:active{background:var(--bubble)}
.action-wrap{position:relative;display:flex;align-items:center}
#convMenu{position:absolute;left:0;bottom:48px;min-width:168px;white-space:nowrap}
#convMenu button{font-size:15px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
border-radius:18px 18px 0 0;z-index:41;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
max-height:80vh;overflow-y:auto}
</style>
<style>

.btn{padding:10px 16px;border-radius:10px;background:var(--accent);
color:var(--accent-t);text-align:center}
.btn.ghost{background:var(--bubble);color:var(--text)}
.btn.red{background:none;color:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
  .tab{padding:6px 14px;border-radius:16px;background:var(--panel);
white-space:nowrap;font-size:14px;color:var(--sub)}
.tab.on{background:var(--accent);color:var(--accent-t)}
.chip{display:inline-block;padding:4px 11px;margin:3px 4px 3px 0;
border-radius:14px;background:var(--bubble);font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-t)}
.field{padding:8px 14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);
display:flex;align-items:center;justify-content:center;padding:24px}
.modal .dlg{background:var(--panel);border-radius:22px;width:100%;
max-width:420px;max-height:84vh;overflow-y:auto;padding:20px}
.dlg h3{margin:0 0 14px;font-size:19px}
.font-choice-list{display:flex;flex-direction:column;margin:0 -4px}
.font-choice{width:100%;min-height:54px;padding:12px 8px;display:flex;align-items:center;justify-content:space-between;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
.font-choice:last-child{border-bottom:0}
.font-choice .radio{width:20px;height:20px;border:2px solid var(--sub);border-radius:50%;display:flex;align-items:center;justify-content:center}
.font-choice.selected .radio{border-color:var(--accent)}
.font-choice.selected .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{
position:fixed;
left:50%;
bottom:calc(20px + env(safe-area-inset-bottom));
transform:translateX(-50%);
background:var(--text);
color:var(--bg);
padding:8px 16px;
border-radius:18px;
z-index:99;
font-size:14px;
}
.bar-line{height:8px;border-radius:4px;background:var(--bubble);overflow:hidden}
.bar-line i{display:block;height:100%;background:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bubble)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
.log{font:12px/1.5 monospace;padding:8px 14px;border-bottom:1px solid var(--line);
white-space:pre-wrap;word-break:break-all}
.ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ai-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bubble); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.ai-info { display: flex; flex-direction: column; }
.ai-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.ai-time { font-size: 11px; color: var(--sub); line-height: 1.2; margin-top: 2px; }
.macaron-picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 0}
.macaron-color{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .15s}
.macaron-color:active{transform:scale(0.9)}
</style>
</head>

q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})},

const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);
t.oncomplete=()=>ok();t.onerror=()=>ok()})}
};

async function retryMsg(m){
if(busy){toast('请等待当前回复结束');return}
const c=curConv();
const idx = c.msgs.findIndex(x=>x.id===m.id);
if(idx === -1) return;
c.msgs.splice(idx, 1);
save();renderChat();
const key = m.model ? DB.sel.find(k=>k.includes(m.model)) || DB.sel[0] : DB.sel[0];
if(!key){toast('请先选择模型');return}
busy=true;stopFlag=false;setSendIc(true);
await runModel(c, key);
busy=false;setSendIc(false);
if(!stopFlag){await maintainMemories(c);summarize(c)}}

  function providerHeaders(p,extra={}){
const h={'Content-Type':'application/json'};
const mode=p.authType||'bearer';
if(p.key&&mode==='bearer')h.Authorization='Bearer '+p.key;
if(p.key&&mode==='x-api-key')h['x-api-key']=p.key;
if(p.key&&mode==='api-key')h['api-key']=p.key;
const raw=String(p.customHeaders||'');
raw.split(/\r?\n/).forEach(line=>{
 const i=line.indexOf(':');if(i<1)return;
 const name=line.slice(0,i).trim(),value=line.slice(i+1).trim().replace(/\$\{key\}/g,p.key||'');
 if(name)h[name]=value;
});
return Object.assign(h,extra);
}
function providerEndpoint(p,path){
 const base=String(p.url||'').trim().replace(/\/+$/,'');
 const part=String(path||'').trim();
 if(/^https?:\/\//i.test(part))return part;
 return base+'/'+part.replace(/^\/+/, '');
}
async function providerFetch(p,path,options={}){
 return fetch(providerEndpoint(p,path),Object.assign({},options,{headers:providerHeaders(p,options.headers||{})}));
  }

function editBook(book,done){
const fresh=!book;
const d=dialog(fresh?'新建世界书':'编辑世界书',`
<div class="field"><label>世界书名称</label>
<input id="bn" value="${esc(book?book.name:'')}"></div>
<div class="field"><label>启用状态</label>
<select id="bo">
<option value="true" ${!book||book.on!==false?'selected':''}>启用</option>
<option value="false" ${book&&book.on===false?'selected':''}>停用</option>
</select></div>`,
m=>{
const name=m.querySelector('#bn').value.trim();
if(!name){toast('请输入名称');return false}
if(fresh)DB.books.push({id:uid(),name,on:true,entries:[]});
else{book.name=name;book.on=m.querySelector('#bo').value==='true'}
save();done()},'保存');
if(fresh)d.querySelector('#bo').value='true'}

function editEntry(e,done,isNew){
const d=dialog(isNew?'添加条目':'编辑条目',`
<div class="field"><label>触发关键词（逗号分隔，留空为始终生效）</label><input id="ek" value="${esc(e.keys)}"></div>
<div class="field"><label>内容</label><textarea id="ec" rows="6">${esc(e.content)}</textarea></div>
<div style="padding:0 14px"><button class="btn red" id="ed">删除条目</button></div>`,
m=>{
e.keys=m.querySelector('#ek').value.trim();
e.content=m.querySelector('#ec').value.trim();
save();done&&done()},'保存');
d.querySelector('#ed').onclick=()=>{
DB.books.forEach(b=>{b.entries=b.entries.filter(x=>x.id!==e.id)});
save();d.remove();done&&done()}}
  function dlFile(name,text){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
a.download=name;a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function calcNext(r){
if(!r.on)return 0;
const d=new Date(r.last||Date.now());
d.setDate(d.getDate()+r.freq);
const t=(r.time||'09:00').split(':');
d.setHours(+t[0],+t[1],0,0);
return d.getTime()}

function openBackup(){
const p=page('数据备份');const b=p.querySelector('.page-b');
const r=DB.settings.remind;
const inc={chat:true,file:true};
const draw=()=>{
b.innerHTML=`

<div class="field" id="bi"></div></div>
<div class="card"><div class="ct">本地备份</div>
<button class="item" id="bx"><div class="grow">导出为文件</div>${ic('right')}</button>
<button class="item" id="bm"><div class="grow">备份文件导入</div>${ic('right')}</button></div>
<div class="card"><div class="ct">定期提醒备份</div>
<div class="item"><div class="grow">开启提醒</div><div class="sw ${r.on?'on':''}" id="rs"></div></div>
<button class="item" id="rf"><div class="grow">提醒频率</div><span class="val">每 ${r.freq} 天</span></button>

[['chat','聊天记录'],['file','文件']].forEach(([k,n])=>{
const c=document.createElement('button');
c.className='chip'+(inc[k]?' on':'');c.textContent=n;
c.onclick=()=>{inc[k]=!inc[k];draw()};
b.querySelector('#bi').appendChild(c)});
b.querySelector('#bx').onclick=()=>{
const o={v:1,t:Date.now(),settings:DB.settings,conv:{...DB.conv,bg:inc.file?DB.conv.bg:''},
providers:DB.providers,sel:DB.sel,books:DB.books,assistants:DB.assistants,memories:DB.memories,stats:DB.stats};
if(inc.chat){
o.cur=DB.cur;
o.convs=DB.convs.map(c=>inc.file?c:{...c,msgs:c.msgs.map(m=>({...m,imgs:[],files:[]}))})}

dlFile(`backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,JSON.stringify(o));
r.last=Date.now();r.next=calcNext(r);save();log('app','导出备份');draw()};

b.querySelector('#rf').onclick=()=>{
const d=dialog('提醒频率',`<select id="fq">${[1,3,7,14,30].map(n=>`<option value="${n}" ${r.freq===n?'selected':''}>每 ${n} 天</option>`).join('')}</select>`,m=>{
r.freq=+m.querySelector('#fq').value;r.next=calcNext(r);save();draw()})};
b.querySelector('#rt').onclick=()=>{
dialog('提醒时间',`<input type="time" id="tm" value="${esc(r.time)}">`,m=>{
r.time=m.querySelector('#tm').value||'09:00';r.next=calcNext(r);save();draw()})};
};

$('#fRestore').onchange=async e=>{
const f=e.target.files[0];e.target.value='';
if(!f)return;
let o;
try{o=JSON.parse(await readText(f))}catch(x){toast('文件格式不对');return}
if(!o||typeof o!=='object'||!o.settings){toast('不是有效的备份文件');return}
ask('导入会覆盖当前数据，确定继续？',()=>{
const nd=merge(DEF(),o);
if(!o.convs){nd.convs=DB.convs;nd.cur=DB.cur}
nd.logs=DB.logs;
DB=nd;save();applyTheme();renderChat();
log('app','导入备份');toast('导入完成')})};

function checkRemind(){
const r=DB.settings.remind;
if(!r.on)return;
if(!r.next)r.next=calcNext(r);
if(Date.now()>=r.next){
dialog('备份提醒','<div>该备份数据了，现在去备份吗？</div>',()=>{openSettings();openBackup()},'去备份');
r.next=calcNext({...r,last:Date.now()});save()}}

function calcStorage(){
let img=0,file=0,chat=0;
DB.convs.forEach(c=>(c.msgs||[]).forEach(m=>{
chat+=sizeOf(m.content||'');
(m.imgs||[]).forEach(u=>img+=u.length);
(m.files||[]).forEach(f=>file+=sizeOf(f.text||''))}));
const asst=sizeOf(DB.books);
const cache=sizeOf(DB.conv.bg||'')+sizeOf(DB.stats);
const logs=sizeOf(DB.logs);
const other=Math.max(0,sizeOf(DB)-img-file-chat-asst-cache-logs);
return [['图片',img],['文件',file],['聊天记录',chat],['世界书',asst],['缓存',cache],['日志',logs],['其他',other]]}

function openStats(){
const p=page('统计');const b=p.querySelector('.page-b');
let range='all',cs=0,ce=0;
const rs=[['all','全部'],['30','近30天'],['lm','上个月'],['lq','上个季度'],['cu','自定义']];
const span=()=>{
const n=new Date(),Y=n.getFullYear(),M=n.getMonth();
if(range==='30')return[Date.now()-30*864e5,Date.now()];
if(range==='lm')return[new Date(Y,M-1,1).getTime(),new Date(Y,M,1).getTime()];
if(range==='lq'){const q=Math.floor(M/3)*3;return[new Date(Y,q-3,1).getTime(),new Date(Y,q,1).getTime()]}
if(range==='cu')return[cs,ce||Date.now()];
return[0,Date.now()+1]};
  const draw=()=>{
const[a,z]=span();
const U=DB.stats.usage.filter(u=>u.t>=a&&u.t<=z);
const cv=DB.convs.filter(c=>c.t>=a&&c.t<=z);
const mc=cv.reduce((s,c)=>s+c.msgs.length,0);
const sum=k=>U.reduce((s,u)=>s+(u[k]||0),0);
const grp=(f)=>{const o={};U.forEach(u=>{const k=f(u)||'未设置';o[k]=(o[k]||0)+1});return Object.entries(o).sort((x,y)=>y[1]-x[1])};
const bars=(arr)=>{const t=arr.reduce((s,x)=>s+x[1],0)||1;
return arr.length?arr.map(([n,v])=>`<div class="item" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(n)}</span><span class="val">${(v/t*100).toFixed(0)}%</span></div><div class="bar-line" style="margin-top:6px"><i style="width:${v/t*100}%"></i></div></div>`).join(''):'<div class="item"><div class="grow sub">暂无数据</div></div>'};

const Y=new Date().getFullYear(),heat={};
DB.stats.usage.forEach(u=>{const d=new Date(u.t);if(d.getFullYear()===Y){const k=d.getMonth()+'-'+d.getDate();heat[k]=(heat[k]||0)+1}});
let hm='';
for(let m=0;m<12;m++){
const dn=new Date(Y,m+1,0).getDate();let cells='';
for(let d=1;d<=dn;d++){const v=heat[m+'-'+d]||0;
cells+=`<i style="${v?`background:var(--accent);opacity:${Math.min(1,.3+v*.15)}`:''}"></i>`}
hm+=`<div class="ct">${m+1}月</div><div class="field"><div class="heat">${cells}</div></div>`}
const pv=grp(u=>u.pname),md=grp(u=>u.model);
const tp=cv.map(c=>[c.title,c.msgs.length]).sort((x,y)=>y[1]-x[1]).slice(0,8);
b.innerHTML=`<div class="tabs" id="rg"></div>
${range==='cu'?`<div class="card"><div class="field"><label>开始</label><input type="date" id="d1"></div><div class="field"><label>结束</label><input type="date" id="d2"></div></div>`:''}
<div class="card"><div class="ct">总览</div><div class="grid2">
<div class="stat"><b>${cv.length}</b><span>对话总数</span></div>
<div class="stat"><b>${mc}</b><span>消息总数</span></div>
<div class="stat"><b>${sum('inT')}</b><span>输入 tokens</span></div>
<div class="stat"><b>${sum('outT')}</b><span>输出 tokens</span></div>
<div class="stat"><b>${sum('cacheT')}</b><span>缓存 tokens</span></div>
<div class="stat"><b>${DB.stats.launch}</b><span>应用启动次数</span></div></div></div>
<div class="card"><div class="ct">聊天热力图 ${Y}</div>${hm}</div>
<div class="card"><div class="ct">供应商用量趋势</div>${bars(pv)}</div>
<div class="card"><div class="ct">模型使用率</div>${bars(md)}</div>
<div class="card"><div class="ct" style="display:flex;justify-content:space-between">话题内容量<button id="zm" style="color:var(--sub)">放大</button></div><div id="tp">${bars(tp.slice(0,5))}</div></div>`;
rs.forEach(([k,n])=>{const t=document.createElement('button');
t.className='tab'+(range===k?' on':'');t.textContent=n;
t.onclick=()=>{range=k;draw()};b.querySelector('#rg').appendChild(t)});
if(range==='cu'){
const d1=b.querySelector('#d1'),d2=b.querySelector('#d2');
if(cs)d1.value=new Date(cs).toISOString().slice(0,10);
if(ce)d2.value=new Date(ce).toISOString().slice(0,10);
d1.onchange=()=>{cs=new Date(d1.value).getTime()||0;draw()};
d2.onchange=()=>{ce=new Date(d2.value).getTime()+864e5-1||0;draw()}}
b.querySelector('#zm').onclick=()=>dialog('话题内容量',bars(tp),null)};
draw()}

const oldBuildMsgs=buildMsgs;
buildMsgs=function(c){
const out=oldBuildMsgs(c);
const rule='你是 Nova AI 助手。无论用户使用什么语言提问，默认始终使用简体中文回答。除非用户明确要求其他语言，否则不得切换语言。';
const first=out.find(x=>x.role==='system');
if(first)first.content=rule+'\n\n'+first.content;
else out.unshift({role:'system',content:rule});
return out};

async function init(){
try{
await load();
if(!DB.settings.fontFamily)DB.settings.fontFamily='system';
if(!DB.settings.chatFs)DB.settings.chatFs=DB.settings.fs||15;
if(!DB.stats)DB.stats={launch:0,usage:[]};
if(!Array.isArray(DB.stats.usage))DB.stats.usage=[];
DB.stats.launch=(DB.stats.launch||0)+1;
if(DB.cur&&!DB.convs.some(c=>c.id===DB.cur)){
DB.cur=DB.convs.length?DB.convs[0].id:null;
}
applyTheme();
syncProfile();
renderChat();
renderConvs();
$('#modelName').textContent=curModelName();
save();
log('app','Nova AI 启动成功');
checkRemind();
}catch(e){
console.error(e);
toast('初始化失败：'+e.message);
}
}
init();
